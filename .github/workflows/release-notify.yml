name: Release — Notify GitHub release

on:
    workflow_call:
        secrets:
            bp_webhook_secret:
                description: Shared secret used to sign the GitHub webhook payload.
                required: true

permissions:
    contents: read

jobs:
    notify:
        runs-on: ubuntu-latest

        steps:
            # Récupère la release après la mise à jour de ses notes par le workflow appelant.
            - name: Notify backtik
              env:
                  BP_NOTIFY_API_URL: https://notifications.backtik.ch/api/notifications/github/releases
                  GH_TOKEN: ${{ github.token }}
                  BP_REPOSITORY: ${{ github.repository }}
                  BP_REPOSITORY_URL: ${{ github.event.repository.html_url }}
                  BP_RELEASE_ACTION: ${{ github.event.action }}
                  BP_TAG_NAME: ${{ github.event.release.tag_name }}
                  BP_WEBHOOK_SECRET: ${{ secrets.bp_webhook_secret }}
              run: |
                  release=$(gh api "repos/$BP_REPOSITORY/releases/tags/$BP_TAG_NAME")

                  payload=$(jq -n \
                    --arg action "$BP_RELEASE_ACTION" \
                    --arg repository "$BP_REPOSITORY" \
                    --arg repository_url "$BP_REPOSITORY_URL" \
                    --argjson release "$release" \
                    '{
                      action: $action,
                      repository: {
                        full_name: $repository,
                        html_url: $repository_url
                      },
                      release: {
                        tag_name: $release.tag_name,
                        name: $release.name,
                        html_url: $release.html_url,
                        body: $release.body,
                        author: {
                          login: $release.author.login
                        },
                        prerelease: $release.prerelease
                      }
                    }')

                  signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$BP_WEBHOOK_SECRET" -hex | sed 's/^.* //')"

                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --request POST \
                    --header "Content-Type: application/json" \
                    --header "X-GitHub-Event: release" \
                    --header "X-Hub-Signature-256: $signature" \
                    --data "$payload" \
                    "$BP_NOTIFY_API_URL"
