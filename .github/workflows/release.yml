name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  generate-changelog:
    uses: backtik-ch/backtik-actions/.github/workflows/generate-changelog.yml@main
    with:
      tag_name: ${{ github.event.release.tag_name }}
      target_commitish: ${{ github.event.release.target_commitish }}
      default_branch: ${{ github.event.repository.default_branch }}
      model: ${{ vars.BTK_CHANGELOG_MODEL }}
      base_url: ${{ vars.BTK_CHANGELOG_BASE_URL }}
    secrets:
      api_key: ${{ secrets.BTK_CHANGELOG_API_KEY }}

  notify-release:
    needs: generate-changelog
    uses: ./.github/workflows/release-notify.yml
    secrets:
      bp_webhook_secret: ${{ secrets.BP_NOTIFICATIONS_GITHUB_RELEASES_WEBHOOK_SECRET }}
