name: Vitest tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npx vitest run