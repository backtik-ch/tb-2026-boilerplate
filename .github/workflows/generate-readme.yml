name: Generate README

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  generate-readme:
    name: Generate README
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    
    permissions:
      contents: write

    steps:
      # Récupère uniquement le contenu de la branche sur laquelle est exécutée la Pull Request.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      # Vérifie si un fichier lié au README et sa génération a été modifié dans le dernier commit.
      - name: Check files changes
        id: files_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Exécution manuelle : la génération du README est lancée."
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}"
          changed_files="$(git diff \
            --name-only \
            "origin/${{ github.base_ref }}...HEAD" \
            -- \
            README.md \
            package.json \
            composer.json \
            docker-compose.yml \
            scripts/readme-generator/prompt.md \
            scripts/readme-generator/README-template.md \
            scripts/readme-generator/analyze-project.mjs \
            scripts/readme-generator/generate-readme.mjs
          )"
          if [ -n "$changed_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Un ou plusieurs fichiers surveillés ont été modifiés"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun fichier surveillé n'a été modifié."
          fi

      # Installe Node.js et initie le cache npm.
      - name: Setup Node.js
        if: steps.files_changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      
      # Installe les dépendances du projet
      - name: Install dependencies
        if: steps.files_changes.outputs.changed == 'true'
        run: npm ci

      # Créer un fichier .env en copiant .env.example
      - name: Create .env
        if: steps.files_changes.outputs.changed == 'true'
        run: cp .env.example .env

      # Exécute les scripts d'analyse du projet et de génération du README par LLM.
      - name: Analyze project and generate README
        if: steps.files_changes.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          node scripts/readme-generator/analyze-project.mjs
          node scripts/readme-generator/generate-readme.mjs

      # Vérifie que le README ait été modifié ou créé pour éviter un commit inutile.
      - name: Check README changes
        id: readme_changes
        if: steps.files_changes.outputs.changed == 'true'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- README.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Le README a été créé ou modifié."
            git status --short -- README.md
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune modification du README."
          fi

      # Configure l'utilisateur Git pour le commit automatique.
      - name: Configure Git
        if: steps.readme_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
      # Créer un commit uniquement pour le README.md.
      - name: Commit README
        if: steps.readme_changes.outputs.changed == 'true'
        run: |
          git add README.md
          git commit -m "docs(readme): update/generate README"

      # Push le commit sur la branche concernée par la Pull Request.
      - name: Push README
        if: steps.readme_changes.outputs.changed == 'true'
        run: |
          git push