name: Tests

on:
  pull_request:
    branches:
      - main
      - preprod

  workflow_dispatch:
  workflow_call:

jobs:
  generate-vitest:
    uses: ./.github/workflows/generate-vitest.yml
    secrets: inherit

  vitest-tests:
    uses: ./.github/workflows/vitest-tests.yml
    secrets: inherit

  playwright-tests:
    uses: ./.github/workflows/playwright-tests.yml
    secrets: inherit